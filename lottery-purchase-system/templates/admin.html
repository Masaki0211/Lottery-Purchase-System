{% extends "base.html" %}

{% block content %}
<h1>Admin Dashboard</h1>

<h2>All Available Ticket Types</h2>

<a href="{{ url_for('add_ticket') }}">Add New Ticket</a>

{% for t in tickets %}
    <div>
        <h3>{{ t.game_name }}</h3>
        <p>Price: ${{ t.price }}</p>
        <p>Drawing Date: {{ t.drawing_date }}</p>
        <p>Active: {{ t.is_active }}</p>

        <a href="{{ url_for('edit_ticket', ticket_id=t.id) }}">Edit</a>

        <form method="POST" action="{{ url_for('delete_ticket', ticket_id=t.id) }}" style="display:inline;">
            <button type="submit" onclick="return confirm('Are you sure you want to remove this ticket?');">
                Remove
            </button>
        </form>
    </div>
    <hr>
{% endfor %}
{% endblock %}
