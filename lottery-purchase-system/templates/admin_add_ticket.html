{% extends "base.html" %}
 
{% block title %}Add Ticket Type{% endblock %}
 
{% block content %}
<h1>Add Ticket Type</h1>
 
<form method="POST">
    <label>Game</label>
    <select name="game_name" required>
        <option value="">-- Select Game --</option>
        {% for gr in game_rules %}
        <option value="{{ gr.game_name }}">{{ gr.game_name }}</option>
        {% endfor %}
    </select>
 
    <label>Ticket Price ($)</label>
    <input type="number" name="price" step="0.01" min="0" placeholder="e.g. 2.00" required>
 
    <label>Drawing Date</label>
    <input type="date" name="drawing_date" required>
 
    <label>Jackpot Amount ($)</label>
    <input type="number" name="prize_amount" step="0.01" min="0" placeholder="e.g. 1000000" required>
 
    <button type="submit">Add Ticket Type</button>
</form>
 
<a href="{{ url_for('admin_dashboard') }}">← Back</a>
{% endblock %}
