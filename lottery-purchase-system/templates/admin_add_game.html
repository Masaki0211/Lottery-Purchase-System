{% extends "base.html" %}
 
{% block title %}Add New Game{% endblock %}
 
{% block content %}
<h1>Add New Game</h1>
 
<form method="POST">
    <label>Game Name</label>
    <input type="text" name="game_name" placeholder="e.g. My Lottery" required>
 
    <label>Main Number Count (how many numbers player picks)</label>
    <input type="number" name="main_count" min="1" max="10" placeholder="e.g. 5" required>
 
    <label>Main Number Range (max value)</label>
    <input type="number" name="main_range" min="1" max="100" placeholder="e.g. 69" required>
 
    <label>Bonus Ball Range (leave empty if no bonus ball)</label>
    <input type="number" name="bonus_range" min="1" max="100" placeholder="e.g. 26">
 
    <button type="submit">Create Game</button>
</form>
{% endblock %}
