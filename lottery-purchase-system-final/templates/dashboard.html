{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<h1>Welcome, {{ user_name }}!</h1>

{% if winning_count > 0 %}
    <p style="color: green; font-weight: bold;">
        You have {{ winning_count }} unclaimed winning ticket(s)!
    </p>
{% endif %}

<div style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px;">

    <a href="{{ url_for('tickets') }}">
        <button style="padding: 15px; min-width: 200px;">Browse Tickets</button>
    </a>

    <a href="{{ url_for('orders') }}">
        <button style="padding: 15px; min-width: 200px;">Order History</button>
    </a>

    <a href="{{ url_for('winning_numbers') }}">
        <button style="padding: 15px; min-width: 200px;">Winning Numbers</button>
    </a>

    <a href="{{ url_for('search') }}">
        <button style="padding: 15px; min-width: 200px;">Search Tickets</button>
    </a>

    <a href="{{ url_for('profile') }}">
        <button style="padding: 15px; min-width: 200px;">Profile</button>
    </a>

    {% if session.get('role') == 'admin' %}
    <a href="{{ url_for('admin_dashboard') }}">
        <button style="padding: 15px; min-width: 200px;">Admin Panel</button>
    </a>
    {% endif %}

</div>

{% endblock %}
